<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Web Music Player Study Lo-fi dengan visualizer real-time.">
  <title>Sismul — Study Lo-fi Player</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="header">
    <div class="header__brand">
      <span class="header__mark" aria-hidden="true"></span>
      <p class="header__logo">Sismul<span class="header__logo-dot">.</span></p>
      <span class="header__tag">study lo-fi</span>
    </div>
    <div class="header__actions">
      <span class="header__status" id="headerStatus">Paused</span>
      <button class="btn-icon" id="themeToggle" type="button" aria-label="Ganti tema gelap terang">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
    </div>
  </header>

  <main class="layout">
    <section class="hero" aria-label="Pemutar musik">
      <p class="hero__kicker"><span class="hero__dot" aria-hidden="true"></span>Current Rotation</p>
      <div class="hero__grid">
        <div class="hero__main">
          <div class="player__cover-wrap">
            <img class="player__cover" id="cover" src="assets/images/cover1.jpg" alt="Cover album Midnight Study" width="260" height="260" fetchpriority="high">
          </div>

          <div class="player__info">
            <h1 class="player__title" id="trackTitle">Midnight Study</h1>
            <p class="player__artist" id="trackArtist">Lo-fi Collective</p>
          </div>

          <div class="player__progress">
            <span class="player__time" id="currentTime">0:00</span>
            <input class="player__seek" id="seek" type="range" min="0" max="100" value="0" step="0.1" aria-label="Posisi lagu">
            <span class="player__time" id="duration">0:00</span>
          </div>

          <div class="player__controls">
            <button class="btn-icon" id="shuffleBtn" type="button" aria-label="Acak" aria-pressed="false">
              <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 3h5v5"/><path d="M4 20 21 3"/><path d="M21 16v5h-5"/><path d="m15 15 6 6"/><path d="M4 4l5 5"/></svg>
            </button>
            <button class="btn-icon" id="prevBtn" type="button" aria-label="Lagu sebelumnya">
              <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor" aria-hidden="true"><path d="M19 20 9 12l10-8v16z"/><rect x="5" y="5" width="2.5" height="14" rx="1"/></svg>
            </button>
            <button class="btn-play" id="playBtn" type="button" aria-label="Putar">
              <svg id="iconPlay" viewBox="0 0 24 24" width="28" height="28" fill="currentColor" aria-hidden="true"><path d="M8 5.5v13l11-6.5-11-6.5z"/></svg>
              <svg id="iconPause" viewBox="0 0 24 24" width="28" height="28" fill="currentColor" aria-hidden="true" hidden><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
            </button>
            <button class="btn-icon" id="nextBtn" type="button" aria-label="Lagu berikutnya">
              <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor" aria-hidden="true"><path d="m5 4 10 8-10 8V4z"/><rect x="16.5" y="5" width="2.5" height="14" rx="1"/></svg>
            </button>
            <button class="btn-icon" id="repeatBtn" type="button" aria-label="Ulangi" aria-pressed="false">
              <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="m7 22-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/></svg>
            </button>
          </div>

          <div class="player__volume">
            <button class="btn-icon" id="muteBtn" type="button" aria-label="Bisukan">
              <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>
            </button>
            <input class="player__vol" id="volume" type="range" min="0" max="1" value="0.8" step="0.01" aria-label="Volume">
          </div>

          <audio id="audio" preload="metadata"></audio>
        </div>
      </div>
      <canvas class="player__visual" id="visualizer" width="600" height="120" aria-hidden="true"></canvas>
      <p class="hero__hint">Visualizer mengikuti musik — jeda bila di-pause agar hemat CPU.</p>
    </section>

    <aside class="playlist" aria-label="Daftar putar">
      <div class="playlist__head">
        <div>
          <h2 class="playlist__title">Up Next</h2>
          <p class="playlist__sub" id="queueCount">5 tracks</p>
        </div>
        <label class="playlist__search">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
          <input id="search" type="search" placeholder="Cari judul / artis…" aria-label="Cari lagu">
        </label>
      </div>
      <ul class="playlist__list" id="playlistList"></ul>
    </aside>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
